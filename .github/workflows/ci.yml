name: "Fork CI"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "website/**"
      - "BUILD.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "latest.json"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "website/**"
      - "BUILD.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "latest.json"
  workflow_dispatch:

jobs:
  version:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/klogg-version

      - name: Save version
        shell: sh
        run: echo "$KLOGG_VERSION" > klogg_version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: klogg_version
          path: klogg_version.txt
          if-no-files-found: error

  windows:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-2022
    env:
      KLOGG_BUILD_ROOT: build_release
      KLOGG_BUILD_CONFIG: RelWithDebInfo
      KLOGG_BUILD_TARGET: ci_build
      KLOGG_QT: Qt6
      KLOGG_ARCH: x64
      KLOGG_DO_INSTALLER: 1
      KLOGG_DO_PACKAGE: 1
      KLOGG_CMAKE_OPTS: -DKLOGG_GENERIC_CPU=ON -DKLOGG_USE_SENTRY=ON -DKLOGG_OVERRIDE_MALLOC=OFF
      BOOST_ROOT: ${{ github.workspace }}\3rdparty\boost
      BOOST_URL: https://archives.boost.io/release/1.86.0/source/boost_1_86_0.zip
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/klogg-version

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: fork-ci-windows-x64-qt6
          modules: qt5compat
          archives: qtbase qtimageformats qtsvg qttools qttranslations icu

      - name: Set Qt env
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "KLOGG_QT_DIR=$env:QT_ROOT_DIR"
          Add-Content -Path $env:GITHUB_ENV -Value "Qt6_DIR=$env:QT_ROOT_DIR\lib\cmake\Qt6"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ env.BOOST_URL }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:BOOST_ROOT -Force | Out-Null
          Invoke-WebRequest -Uri $env:BOOST_URL -OutFile "$env:BOOST_ROOT\download.zip"
          7z x "$env:BOOST_ROOT\download.zip" "-o$env:BOOST_ROOT" -y -bd
          Copy-Item "$env:BOOST_ROOT\boost_*\\*" $env:BOOST_ROOT -Recurse -Force
          if (-not (Test-Path "$env:BOOST_ROOT\boost")) {
            throw "Boost headers were not extracted into $env:BOOST_ROOT"
          }
          Remove-Item "$env:BOOST_ROOT\boost_*" -Recurse -Force
          Remove-Item "$env:BOOST_ROOT\download.zip" -Force -ErrorAction SilentlyContinue

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\packaging\windows\openssl-1.1
          key: openssl-1.1.1w-firedaemon

      - name: Download OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.firedaemon.com/download-firedaemon-openssl-1.1.1-zip" -OutFile openssl.zip
          New-Item -ItemType Directory -Path "${{ github.workspace }}\packaging\windows" -Force | Out-Null
          7z x openssl.zip "-o${{ github.workspace }}\packaging\windows" -y -bd

      - name: Prepare MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, test and package Windows release
        shell: pwsh
        run: |
          & .\packaging\windows\build_release_bundle.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$env:KLOGG_BUILD_ROOT"
          ctest --verbose -C $env:KLOGG_BUILD_CONFIG
          $exitCode = $LASTEXITCODE
          Pop-Location
          exit $exitCode

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows-x64-qt6
          path: ${{ github.workspace }}/${{ env.KLOGG_BUILD_ROOT }}/packages/*
          if-no-files-found: error

  linux:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-22.04
    env:
      KLOGG_BUILD_ROOT: build_appimage
      KLOGG_CMAKE_OPTS: -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_BUILD_WITH_INSTALL_RPATH=on -DKLOGG_GENERIC_CPU=ON -DKLOGG_USE_SENTRY=ON -DCMAKE_INSTALL_PREFIX=/usr
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        shell: sh
        run: |
          cd docker/ubuntu20.04
          docker build -t klogg_ubuntu20.04 .

      - uses: ./.github/actions/klogg-version

      - name: Configure Linux build
        shell: sh
        run: |
          docker run \
            --env KLOGG_VERSION="$KLOGG_VERSION" \
            --env KLOGG_BUILD_ROOT="$KLOGG_BUILD_ROOT" \
            --env KLOGG_CMAKE_OPTS="$KLOGG_CMAKE_OPTS" \
            -v "$GITHUB_WORKSPACE":/usr/local \
            klogg_ubuntu20.04 \
            /bin/bash -c "cmake -B /usr/local/$KLOGG_BUILD_ROOT $KLOGG_CMAKE_OPTS -DCPM_SOURCE_CACHE=/usr/local/cpm_cache /usr/local"

      - name: Build Linux
        shell: sh
        run: |
          docker run \
            --env KLOGG_BUILD_ROOT="$KLOGG_BUILD_ROOT" \
            -v "$GITHUB_WORKSPACE":/usr/local \
            klogg_ubuntu20.04 \
            /bin/bash -c "cmake --build /usr/local/$KLOGG_BUILD_ROOT --target ci_build"

      - name: Run Linux tests
        shell: sh
        run: |
          docker run \
            --env KLOGG_BUILD_ROOT="$KLOGG_BUILD_ROOT" \
            -v "$GITHUB_WORKSPACE":/usr/local \
            klogg_ubuntu20.04 \
            /bin/bash -c "cd /usr/local/$KLOGG_BUILD_ROOT && ctest --verbose"

      - name: Package Linux AppImage
        shell: sh
        run: |
          docker run \
            --device /dev/fuse \
            --privileged \
            --env KLOGG_VERSION="$KLOGG_VERSION" \
            --env KLOGG_BUILD_ROOT="$KLOGG_BUILD_ROOT" \
            -v "$GITHUB_WORKSPACE":/usr/local \
            klogg_ubuntu20.04 \
            /bin/bash -c "cd /usr/local/$KLOGG_BUILD_ROOT && ../packaging/linux/appimage/generate_appimage.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-appimage
          path: ${{ github.workspace }}/${{ env.KLOGG_BUILD_ROOT }}/packages/*
          if-no-files-found: error
